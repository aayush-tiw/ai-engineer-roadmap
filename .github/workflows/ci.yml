name: CI

on:
  push:
    paths:
      - "Week-6/ci-project/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r Week-6/ci-project/requirements.txt

      - name: Run tests
        run: pytest Week-6/ci-project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci
        working-directory: Week-6/ci-project

      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: Week-6/ci-project

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: Week-6/ci-project
name: CI

on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "Week-6/ci-project/**"
      - "Week-6/Day3/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Day 2 - Python dependencies
      - name: Install ci-project dependencies
        run: pip install -r Week-6/ci-project/requirements.txt

      # Day 2 - Python tests
      - name: Run ci-project tests
        run: pytest Week-6/ci-project

      # Day 2 - Playwright
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci
        working-directory: Week-6/ci-project

      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: Week-6/ci-project

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: Week-6/ci-project
      # Day 3 - Install quality tools
      - name: Install Day3 dependencies
        run: pip install -r requirements.txt
        working-directory: Week-6/Day3

      # Day 3 - Tests + Coverage
      - name: Run Day3 tests with coverage
        run: python -m pytest --cov=app --cov-fail-under=80
        working-directory: Week-6/Day3

      # Day 3 - Linting
      - name: Run Ruff lint
        run: ruff check .
        working-directory: Week-6/Day3

      # Day 3 - Formatting
      - name: Check Ruff formatting
        run: ruff format --check .
        working-directory: Week-6/Day3
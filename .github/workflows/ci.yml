name: CI

on:
  push:
    paths:
      - "Week-6/ci-project/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r Week-6/ci-project/requirements.txt

      - name: Run tests
        run: pytest Week-6/ci-project